<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Browser tab + iOS home screen. The SVG is the generic placeholder that
         shipped with the template; the PNG is the real MV mark. Order matters:
         browsers take the first format they understand, so the real icon leads. -->
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon-64.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Tells browsers this site is light-mode only — prevents Chrome Android
         Force Dark Mode and iOS Smart Invert from darkening the UI. -->
    <meta name="color-scheme" content="light" />
    <meta name="description" content="Book trusted, professional home cleaning services with MV Cleaning Services. Deep cleaning, kitchen, bathroom, sofa & more." />
    <meta name="theme-color" content="#014eb4" />

    <!-- Open Graph defaults (overridden per-page by Seo component) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="MV Cleaning Services" />
    <meta property="og:image" content="/images/hero.webp" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Preconnect to Google Fonts for faster load -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Outfit:wght@600;700;800;900&family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&display=swap" />

    <title>MV Cleaning Services — Professional Home Cleaning</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
